---
- name: Import common playbook
  ansible.builtin.import_playbook: ../static-assignments/common.yml
- name: Configure database
  ansible.builtin.import_playbook: database.yml

- name: Configure webservers
  hosts: web
  become: true

  tasks:
    - name: Include environment variables
      ansible.builtin.include_vars:
        file: ../env-vars/dev.yml

    - name: Import webserver configuration
      ansible.builtin.import_tasks: ../static-assignments/uat-webservers.yml
